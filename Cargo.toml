[package]
name = "my-sourcecode"
version = "0.1.0"
edition = "2024"
description = "Terminal analyzer for the source code of a local git repository"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
linguist = "0.1.17"
ratatui = "0.26.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tokei = "15.0.0"
